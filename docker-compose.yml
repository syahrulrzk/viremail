services:
  postgres:
    image: postgres:16-alpine
    container_name: vire-core
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osintmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintmail123}
      POSTGRES_DB: ${POSTGRES_DB:-osintmail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osintmail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/syahrulrzk/viremail/backend:latest
    container_name: vire-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://osintmail:osintmail123@postgres:5432/osintmail
    restart: unless-stopped

  worker:
    image: ghcr.io/syahrulrzk/viremail/worker:latest
    container_name: vire-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://osintmail:osintmail123@postgres:5432/osintmail
    restart: unless-stopped
    deploy:
      replicas: 1

  frontend:
    image: ghcr.io/syahrulrzk/viremail/frontend:latest
    container_name: vire-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
