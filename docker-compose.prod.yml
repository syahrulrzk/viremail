version: '3.8'

# Production docker-compose — pulls pre-built images from GHCR.
# Usage:
#   export IMAGE_TAG=main       # or a commit SHA / release tag
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: vire-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osintmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osintmail123}
      POSTGRES_DB: ${POSTGRES_DB:-osintmail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osintmail}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vire-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/vire}/backend:${IMAGE_TAG:-latest}
    container_name: vire-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    restart: unless-stopped

  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/vire}/worker:${IMAGE_TAG:-latest}
    container_name: vire-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-3}

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/vire}/frontend:${IMAGE_TAG:-latest}
    container_name: vire-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
